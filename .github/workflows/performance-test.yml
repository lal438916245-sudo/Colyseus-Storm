name: Colyseus-Storm closed-loop smoke

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  closed_loop:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      STORM_SERVER_ROOT: ${{ github.workspace }}/game-server/colyseus-game-client/Server
      STORM_NODE: node
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: lal438916245-sudo/colyseus-game-server
          path: game-server
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt
      - name: Install matching game server dependencies
        working-directory: game-server/colyseus-game-client/Server
        run: npm ci --legacy-peer-deps
      - name: Verify protocol, search, gate and resource helpers
        run: |
          python -m unittest discover -s tests -v
          python -m unittest discover -s experiments -p 'test_*.py' -v
          node experiments/test_step_statistics.cjs
          node experiments/test_close_observer.cjs
      - name: One-command staircase smoke with strict exit gate
        run: python storm.py verify --steps 2,4 --hold 10 --warmup 1 --workers 1 --profile-seconds 0 --output reports/ci-verify
      - name: One-command strict lifecycle smoke
        run: python storm.py locust --users 2 --spawn-rate 2 --run-time 15s --output reports/ci-locust
      - name: Recover owned resources even after cancellation
        if: always()
        run: |
          for run in reports/ci-verify reports/ci-locust; do
            if [ -f "$run/ownership.json" ]; then python storm.py recover --output "$run"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storm-closed-loop-evidence
          path: reports/ci-*
          retention-days: 7
