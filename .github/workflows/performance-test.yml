name: Colyseus-Storm Performance Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  performance_test:
    runs-on: ubuntu-20.04

    services:
      mongodb:
        image: mongo:5.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand({ping:1})' --quiet"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout pressure test code
        uses: actions/checkout@v4

      - name: Checkout game server code
        uses: actions/checkout@v4
        with:
          repository: lal438916245-sudo/colyseus-game-server
          path: game-server

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Cache npm
        uses: actions/cache@v4
        with:
          path: game-server/colyseus-game-client/Server/node_modules
          key: ${{ runner.os }}-npm-${{ hashFiles('game-server/colyseus-game-client/Server/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install Python dependencies
        run: |
          echo "安装 Python 依赖..."
          pip install -r requirements.txt

      - name: Install Node.js dependencies
        run: |
          echo "安装 Node.js 依赖..."
          cd game-server/colyseus-game-client/Server
          npm install --legacy-peer-deps
          ls -la

      - name: Show server structure
        run: |
          echo "服务端目录结构："
          ls -la game-server/colyseus-game-client/Server/

      - name: Start game server
        run: |
          echo "启动 Colyseus 游戏服务端..."
          cd game-server/colyseus-game-client/Server
          export DEMO_DATABASE="mongodb://localhost:27017/Colyseus_MMO_Demo"
          npm start &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"
          # 等待服务端启动
          sleep 20
          curl --retry 5 --retry-delay 3 http://localhost:2567 || echo "服务端可能还在启动中..."
          # 保持进程
          wait $SERVER_PID

      - name: Verify connectivity
        run: |
          echo "验证连通性..."
          python bot_poc.py

      - name: Run performance test
        run: |
          echo "启动无头压测模式，模拟 50人并发..."
          locust -f locustfile.py --headless -u 50 -r 10 --run-time 3m --csv=reports/colyseus_test_run

      - name: Generate analysis report
        run: |
          echo "生成性能分析报告..."
          python analyze_locust.py

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colyseus-performance-reports
          path: reports/
          retention-days: 7